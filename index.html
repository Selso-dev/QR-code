<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;}
#tela-inicial{position:fixed;inset:0;z-index:20;background:#0b0b0f;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px;}
#tela-inicial button{margin-top:20px;padding:14px 28px;font-size:16px;border:none;border-radius:999px;background:#6c5ce7;color:#fff;font-weight:600;cursor:pointer;}
#aviso-alvo{position:fixed;bottom:24px;left:0;right:0;z-index:15;text-align:center;color:#fff;font-family:system-ui,sans-serif;font-size:14px;opacity:.85;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.8);}
</style>
</head>
<body>
<div id="tela-inicial">
<h2>Aponte a câmera para a imagem</h2>
<p>Toque no botão abaixo para ligar a câmera e iniciar a experiência.</p>
<button id="btn-iniciar">Iniciar câmera</button>
</div>
<div id="aviso-alvo">Procurando a imagem...</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-assets>
<video id="video-ar" src="./video.mp4" preload="auto" loop="false" playsinline webkit-playsinline crossorigin="anonymous"></video>
</a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="alvo" mindar-image-target="targetIndex: 0">
<a-video src="#video-ar" width="1" height="1.7778" position="0 0 0" rotation="0 0 0"></a-video>
</a-entity>
</a-scene>
<script>
const sceneEl = document.querySelector('a-scene');
const video = document.querySelector('#video-ar');
const avisoAlvo = document.querySelector('#aviso-alvo');
const telaInicial = document.querySelector('#tela-inicial');
const btnIniciar = document.querySelector('#btn-iniciar');
btnIniciar.addEventListener('click', async () => {
  telaInicial.style.display = 'none';
  const arSystem = sceneEl.systems['mindar-image-system'];
  await arSystem.start();
});
const alvo = document.querySelector('#alvo');
alvo.addEventListener('targetFound', () => {
  avisoAlvo.style.display = 'none';
  video.currentTime = 0;
  video.play();
});
alvo.addEventListener('targetLost', () => {
  avisoAlvo.style.display = 'block';
  video.pause();
});
</script>
</body>
</html>
